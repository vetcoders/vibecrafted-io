<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCraft Pipeline Playground</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1b1b1a;
  color: #f2efdd;
  font-family: 'SF Mono', 'JetBrains Mono', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
canvas {
  display: block;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.hud {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: rgba(27,27,26,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(242,239,221,0.1);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11px;
  z-index: 10;
}
.phase-pip {
  padding: 4px 10px;
  border-radius: 4px;
  color: rgba(242,239,221,0.4);
  transition: all 0.3s;
  cursor: default;
  white-space: nowrap;
}
.phase-pip.active {
  background: rgba(212,107,63,0.25);
  color: #f2efdd;
  font-weight: 600;
}
.phase-pip.done {
  color: rgba(125,142,87,0.7);
}
.stats-bar {
  position: fixed;
  top: 16px;
  right: 20px;
  font-size: 12px;
  color: rgba(242,239,221,0.6);
  text-align: right;
  line-height: 1.6;
  z-index: 10;
}
.stats-bar .val { color: #f2efdd; font-weight: 600; }
.stats-bar .err { color: #e05544; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="stats-bar">
  <div>Phase: <span class="val" id="phaseName">init</span></div>
  <div>Coverage: <span class="val" id="coverage">0%</span></div>
  <div>Marbles: <span class="val" id="marbleCount">0</span></div>
</div>
<div class="hud" id="hud"></div>
<script>
// ============ VIBECRAFT PIPELINE PLAYGROUND ============
(function() {
  var C = document.getElementById('c');
  var ctx = C.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, CX, CY, BOARD_R, MR;

  // ---- PHASES ----
  var PHASES = [
    { name: 'init',     label: 'Init',     duration: 1500 },
    { name: 'workflow', label: 'Workflow',  duration: 2000 },
    { name: 'agents',   label: 'Agents',   duration: 2500 },
    { name: 'marbles',  label: 'Marbles',  duration: 3000 },
    { name: 'overflow', label: 'Overflow',  duration: 2500 },
    { name: 'error',    label: 'ERR',      duration: 1000 },
    { name: 'followup', label: 'Followup', duration: 1500 },
    { name: 'prune',    label: 'Prune',    duration: 2000 },
    { name: 'hydrate',  label: 'Hydrate',  duration: 2500 },
    { name: 'decorate', label: 'Decorate', duration: 2000 },
    { name: 'ship',     label: 'Ship',     duration: 3000 },
  ];

  var phase = 0;
  var phaseTime = 0;
  var lastT = 0;

  // ---- BOARD STATE ----
  var slots = [];
  var marbles = [];
  var overflowMarbles = []; // marbles not in grooves
  var grooveRevealProgress = 0; // 0-1, how many grooves are visible
  var boardAlpha = 0; // board visibility
  var shakeX = 0, shakeY = 0;
  var coveragePct = 0;
  var errorFlash = 0;

  // ---- SEEDED PRNG ----
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(42);

  // ---- PALETTE ----
  var PAL = {
    amber:  { base: '#d46b3f', light: '#f4c89a' },
    ocean:  { base: '#5b87a8', light: '#c2ddf0' },
    forest: { base: '#7d8e57', light: '#bdd4a0' },
    smoke:  { base: '#9b9a95', light: '#e8e6dc' },
    rose:   { base: '#c46b8a', light: '#f0c4d4' },
    violet: { base: '#8b7ec8', light: '#cdc4ef' },
    honey:  { base: '#cc8844', light: '#f0d4a0' },
    teal:   { base: '#5ba3a3', light: '#a8dede' },
  };
  var PAL_KEYS = Object.keys(PAL);

  // ---- MARBLE SPRITE CACHE ----
  var spriteCache = {};
  function makeSprite(radius, palKey, seed) {
    var key = radius + ':' + palKey + ':' + seed;
    if (spriteCache[key]) return spriteCache[key];
    var s = (radius * 2 + 4) * 2;
    var oc = document.createElement('canvas');
    oc.width = s; oc.height = s;
    var g = oc.getContext('2d');
    var cx = s/2, cy = s/2, r = radius;
    var p = PAL[palKey];
    var base = hexToRgb(p.base), light = hexToRgb(p.light);

    // Shadow
    g.beginPath();
    g.ellipse(cx + r*0.05, cy + r*0.82, r*0.6, r*0.18, 0, 0, Math.PI*2);
    g.fillStyle = 'rgba(0,0,0,0.2)';
    g.fill();

    // Sphere
    g.save();
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.clip();
    var bg = g.createRadialGradient(cx-r*0.3, cy-r*0.35, r*0.05, cx+r*0.1, cy+r*0.1, r*1.1);
    bg.addColorStop(0, rgbStr(lighten(base,60),0.95));
    bg.addColorStop(0.35, rgbStr(base,0.92));
    bg.addColorStop(0.7, rgbStr(darken(base,25),0.9));
    bg.addColorStop(1, rgbStr(darken(base,55),0.85));
    g.fillStyle = bg; g.fillRect(0,0,s,s);

    // Internal swirl
    var prng = mulberry32(seed);
    g.save(); g.translate(cx,cy);
    var tw = r*0.15 + prng()*r*0.1;
    g.beginPath();
    for (var t=0; t<Math.PI*3; t+=0.1) {
      var sr = r*0.1 + (t/(Math.PI*3))*r*0.8;
      var sx = Math.cos(prng()*6+t)*sr, sy = Math.sin(prng()*6+t)*sr;
      t === 0 ? g.moveTo(sx,sy) : g.lineTo(sx,sy);
    }
    g.lineWidth = tw;
    g.strokeStyle = rgbStr(light, 0.4);
    g.lineCap = 'round'; g.stroke();
    g.restore();

    // Highlight
    var hl = g.createRadialGradient(cx-r*0.28, cy-r*0.32, r*0.02, cx-r*0.15, cy-r*0.2, r*0.5);
    hl.addColorStop(0, 'rgba(255,255,255,0.9)');
    hl.addColorStop(0.15, 'rgba(255,255,255,0.5)');
    hl.addColorStop(0.5, 'rgba(255,255,255,0.08)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fillRect(0,0,s,s);

    // Rim
    var rim = g.createRadialGradient(cx,cy,r*0.75, cx,cy,r);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(0.8, 'rgba(0,0,0,0.06)');
    rim.addColorStop(1, 'rgba(0,0,0,0.25)');
    g.fillStyle = rim; g.fillRect(0,0,s,s);

    g.restore();
    spriteCache[key] = oc;
    return oc;
  }

  // ---- COLOR UTILS ----
  function hexToRgb(hex) {
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return {r:r,g:g,b:b};
  }
  function rgbStr(c,a) { return 'rgba('+c.r+','+c.g+','+c.b+','+(a||1)+')'; }
  function lighten(c,n) { return {r:Math.min(255,c.r+n),g:Math.min(255,c.g+n),b:Math.min(255,c.b+n)}; }
  function darken(c,n) { return {r:Math.max(0,c.r-n),g:Math.max(0,c.g-n),b:Math.max(0,c.b-n)}; }

  // ---- GROOVE GRID ----
  function buildSlots() {
    slots = [];
    var sp = MR * 2.2, rh = sp * 0.866, row = 0;
    for (var y = CY - BOARD_R + MR; y <= CY + BOARD_R - MR; y += rh) {
      var off = (row % 2) ? sp/2 : 0;
      for (var x = CX - BOARD_R + MR; x <= CX + BOARD_R - MR; x += sp) {
        var px = x + off, dx = px - CX, dy = y - CY;
        if (Math.sqrt(dx*dx + dy*dy) + MR*0.85 <= BOARD_R) {
          slots.push({
            x: px, y: y,
            filled: false,
            revealOrder: 0, // set below
            visible: false
          });
        }
      }
      row++;
    }
    // Assign reveal order: spiral from center
    slots.sort(function(a,b) {
      var da = Math.sqrt((a.x-CX)*(a.x-CX)+(a.y-CY)*(a.y-CY));
      var db = Math.sqrt((b.x-CX)*(b.x-CX)+(b.y-CY)*(b.y-CY));
      return da - db;
    });
    for (var i=0; i<slots.length; i++) slots[i].revealOrder = i;
    marbles = [];
    overflowMarbles = [];
  }

  // ---- GROOVE DRAWING ----
  function drawGroove(x, y, r, alpha) {
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, r*0.95, 0, Math.PI*2);
    var sg = ctx.createRadialGradient(x-r*0.1, y-r*0.1, r*0.2, x, y, r*0.95);
    sg.addColorStop(0, 'rgba(0,0,0,0.28)');
    sg.addColorStop(0.6, 'rgba(0,0,0,0.18)');
    sg.addColorStop(1, 'rgba(0,0,0,0.05)');
    ctx.fillStyle = sg; ctx.fill();
    // Ring
    ctx.beginPath(); ctx.arc(x, y, r*0.72, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- SPAWN MARBLE ----
  function spawnMarble(targetSlot, chaos, palKey) {
    var angle = Math.random() * Math.PI * 2;
    var dist = BOARD_R * (0.6 + chaos * 0.8);
    return {
      x: CX + Math.cos(angle) * dist,
      y: CY + Math.sin(angle) * dist - BOARD_R * chaos * 0.3,
      vx: (Math.random()-0.5) * 14 * chaos,
      vy: (Math.random()-0.5) * 10 * chaos + 3,
      target: targetSlot,
      settled: false,
      seed: Math.floor(Math.random()*99999),
      pal: palKey || PAL_KEYS[Math.floor(Math.random()*PAL_KEYS.length)],
      alpha: 1,
      saturation: 0.6
    };
  }

  function spawnOverflow() {
    var angle = Math.random() * Math.PI * 2;
    var dist = BOARD_R * 1.2;
    return {
      x: CX + Math.cos(angle) * dist,
      y: CY - BOARD_R * 0.5 - Math.random() * 100,
      vx: (Math.random()-0.5) * 20,
      vy: 10 + Math.random() * 15,
      settled: false,
      seed: Math.floor(Math.random()*99999),
      pal: PAL_KEYS[Math.floor(Math.random()*PAL_KEYS.length)],
      alpha: 1,
      saturation: 0.5,
      // No target — just lands anywhere on the board
      landY: CY + (Math.random()-0.5) * BOARD_R * 0.8,
      landX: CX + (Math.random()-0.5) * BOARD_R * 0.8,
    };
  }

  // ---- PHYSICS ----
  function updateMarble(m, dt) {
    if (m.settled) return;
    var tx = m.target ? m.target.x : m.landX;
    var ty = m.target ? m.target.y : m.landY;
    var dx = tx - m.x, dy = ty - m.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var attract = 0.012 + (m.target ? 0.008 : 0.004);
    m.vx += dx * attract;
    m.vy += dy * attract;
    m.vx *= 0.87; m.vy *= 0.87;
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (dist < 2 && Math.abs(m.vx) < 0.8 && Math.abs(m.vy) < 0.8) {
      m.settled = true;
      m.x = tx; m.y = ty;
      if (m.target) m.target.filled = true;
    }
  }

  // ---- PHASE LOGIC ----
  var throwTimer = 0;

  function updatePhase(dt) {
    var p = PHASES[phase];
    phaseTime += dt;
    throwTimer -= dt;

    switch(p.name) {
      case 'init':
        // Board fades in with a slam
        boardAlpha = Math.min(1, phaseTime / 400);
        if (phaseTime < 200) {
          shakeX = (Math.random()-0.5) * 4 * (1 - phaseTime/200);
          shakeY = (Math.random()-0.5) * 4 * (1 - phaseTime/200);
        } else { shakeX = 0; shakeY = 0; }
        break;

      case 'workflow':
        // Grooves reveal spirally
        grooveRevealProgress = Math.min(1, phaseTime / (p.duration * 0.85));
        break;

      case 'agents':
        // Few marbles, precise, low chaos
        if (throwTimer <= 0) {
          var empty = slots.filter(function(s){return !s.filled && s.visible;});
          if (empty.length > 0) {
            var pick = empty[Math.floor(Math.random()*empty.length)];
            marbles.push(spawnMarble(pick, 0.15, 'ocean'));
          }
          throwTimer = 400 + Math.random() * 300;
        }
        break;

      case 'marbles':
        // Handfuls, growing chaos
        var progress = phaseTime / p.duration;
        var batchSize = Math.ceil(2 + progress * 6);
        if (throwTimer <= 0) {
          var empty = slots.filter(function(s){return !s.filled && s.visible;});
          for (var i = 0; i < Math.min(batchSize, empty.length); i++) {
            var idx = Math.floor(Math.random()*empty.length);
            marbles.push(spawnMarble(empty[idx], 0.3 + progress * 0.5));
            empty.splice(idx, 1);
          }
          throwTimer = 300 - progress * 150;
        }
        break;

      case 'overflow':
        // Too many! Marbles land everywhere, not just grooves
        if (throwTimer <= 0) {
          // Keep filling remaining grooves
          var empty = slots.filter(function(s){return !s.filled && s.visible;});
          if (empty.length > 0) {
            var pick = empty[Math.floor(Math.random()*empty.length)];
            marbles.push(spawnMarble(pick, 0.8));
          }
          // Plus overflow marbles that land anywhere
          for (var i = 0; i < 3 + Math.floor(Math.random()*4); i++) {
            overflowMarbles.push(spawnOverflow());
          }
          throwTimer = 200;
        }
        break;

      case 'error':
        // Flash red, freeze
        errorFlash = Math.sin(phaseTime * 0.015) * 0.5 + 0.5;
        break;

      case 'followup':
        // Shake — overflow marbles start falling off
        if (phaseTime < 400) {
          shakeX = Math.sin(phaseTime * 0.08) * 3 * (1 - phaseTime/400);
          shakeY = Math.cos(phaseTime * 0.06) * 2 * (1 - phaseTime/400);
        } else {
          shakeX *= 0.9; shakeY *= 0.9;
        }
        // Overflow marbles get gravity pulling them down
        overflowMarbles.forEach(function(m) {
          if (m.settled) {
            m.vy += 0.5;
            m.y += m.vy;
            m.alpha = Math.max(0, m.alpha - 0.008);
          }
        });
        overflowMarbles = overflowMarbles.filter(function(m){ return m.alpha > 0.01; });
        break;

      case 'prune':
        // A few settled marbles get dislodged, creating gaps
        if (phaseTime < 100) {
          var filled = slots.filter(function(s){ return s.filled; });
          var toLose = Math.min(5, Math.ceil(filled.length * 0.06));
          for (var i = 0; i < toLose; i++) {
            var pick = filled[Math.floor(Math.random()*filled.length)];
            pick.filled = false;
            // Remove corresponding marble
            for (var j = marbles.length-1; j >= 0; j--) {
              if (marbles[j].target === pick && marbles[j].settled) {
                marbles[j].settled = false;
                marbles[j].vy = -5 - Math.random()*5;
                marbles[j].vx = (Math.random()-0.5)*8;
                marbles[j].target = null;
                marbles[j].landY = H + 50; // fall off screen
                marbles[j].landX = marbles[j].x;
                break;
              }
            }
          }
        }
        // Falling marbles continue
        marbles.forEach(function(m) {
          if (!m.settled && !m.target) {
            m.vy += 0.3;
            m.y += m.vy;
            m.alpha = Math.max(0, m.alpha - 0.005);
          }
        });
        marbles = marbles.filter(function(m){ return m.alpha > 0.01 || m.settled; });
        break;

      case 'hydrate':
        // Precise placement of remaining gaps
        if (throwTimer <= 0) {
          var empty = slots.filter(function(s){return !s.filled && s.visible;});
          if (empty.length > 0) {
            var pick = empty[0]; // deterministic, closest first
            marbles.push(spawnMarble(pick, 0.05, 'forest'));
          }
          throwTimer = 500;
        }
        break;

      case 'decorate':
        // All marbles saturate
        marbles.forEach(function(m) {
          if (m.settled) m.saturation = Math.min(1, m.saturation + 0.003);
        });
        break;

      case 'ship':
        // Golden shimmer, then fade and reset
        if (phaseTime > p.duration * 0.7) {
          boardAlpha = Math.max(0, boardAlpha - 0.01);
          marbles.forEach(function(m){ m.alpha = Math.max(0, m.alpha - 0.008); });
        }
        break;
    }

    // Phase transition
    if (phaseTime >= p.duration) {
      phaseTime = 0;
      phase = (phase + 1) % PHASES.length;
      throwTimer = 0;
      errorFlash = 0;

      // Reset on new cycle
      if (phase === 0) {
        buildSlots();
        boardAlpha = 0;
        grooveRevealProgress = 0;
        shakeX = 0; shakeY = 0;
      }
    }
  }

  // ---- RENDER ----
  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Board base plate
    if (boardAlpha > 0) {
      ctx.globalAlpha = boardAlpha;
      ctx.beginPath();
      ctx.arc(CX, CY, BOARD_R * 1.05, 0, Math.PI*2);
      var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, BOARD_R*1.05);
      bg.addColorStop(0, 'rgba(40,40,38,0.7)');
      bg.addColorStop(1, 'rgba(20,20,18,0.9)');
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = 'rgba(242,239,221,0.06)';
      ctx.lineWidth = 1.5; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Grooves
    var visibleCount = Math.floor(grooveRevealProgress * slots.length);
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      s.visible = (s.revealOrder < visibleCount);
      if (s.visible && boardAlpha > 0) {
        drawGroove(s.x, s.y, MR, boardAlpha * 0.8);
      }
    }

    // Error flash overlay
    if (errorFlash > 0) {
      ctx.globalAlpha = errorFlash * 0.15;
      ctx.fillStyle = '#e05544';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      // ERR text
      if (errorFlash > 0.3) {
        ctx.globalAlpha = errorFlash * 0.8;
        ctx.font = 'bold ' + (BOARD_R * 0.3) + 'px sans-serif';
        ctx.fillStyle = '#e05544';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('P0', CX, CY);
        ctx.globalAlpha = 1;
      }
    }

    // Render all marbles (sorted by Y for depth)
    var allMarbles = marbles.concat(overflowMarbles).sort(function(a,b){ return a.y - b.y; });
    for (var i = 0; i < allMarbles.length; i++) {
      var m = allMarbles[i];
      if (m.alpha <= 0) continue;
      var sprite = makeSprite(MR, m.pal, m.seed);
      var speed = Math.sqrt(m.vx*m.vx + m.vy*m.vy);
      var hover = m.settled ? 0 : Math.min(MR, speed * 1.2);

      // Shadow when hovering
      if (hover > 1) {
        ctx.globalAlpha = m.alpha * 0.3;
        ctx.beginPath();
        ctx.ellipse(m.x, m.y + MR*0.6, MR*0.6, MR*0.25, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,1)'; ctx.fill();
      }

      ctx.globalAlpha = m.alpha * m.saturation;
      ctx.drawImage(sprite, m.x - sprite.width/2, m.y - hover - sprite.height/2);
    }
    ctx.globalAlpha = 1;

    // Coverage counter in center
    var filled = slots.filter(function(s){return s.filled;}).length;
    var total = slots.filter(function(s){return s.visible;}).length;
    var overflow = overflowMarbles.filter(function(m){return m.settled;}).length;
    coveragePct = total > 0 ? Math.round(((filled + overflow) / total) * 100) : 0;

    ctx.restore();
  }

  // ---- HUD ----
  var hudEl = document.getElementById('hud');
  var phaseNameEl = document.getElementById('phaseName');
  var coverageEl = document.getElementById('coverage');
  var marbleCountEl = document.getElementById('marbleCount');

  function buildHUD() {
    hudEl.innerHTML = '';
    for (var i = 0; i < PHASES.length; i++) {
      var pip = document.createElement('span');
      pip.className = 'phase-pip';
      pip.textContent = PHASES[i].label;
      pip.dataset.idx = i;
      hudEl.appendChild(pip);
    }
  }

  function updateHUD() {
    var pips = hudEl.children;
    for (var i = 0; i < pips.length; i++) {
      pips[i].className = 'phase-pip' + (i === phase ? ' active' : '') + (i < phase ? ' done' : '');
    }
    phaseNameEl.textContent = PHASES[phase].label;
    coverageEl.textContent = coveragePct + '%';
    coverageEl.className = coveragePct > 100 ? 'val err' : 'val';
    marbleCountEl.textContent = marbles.length + overflowMarbles.length;
  }

  // ---- RESIZE ----
  function resize() {
    W = window.innerWidth * 0.85;
    H = window.innerHeight * 0.8;
    C.width = W * DPR; C.height = H * DPR;
    C.style.width = W + 'px'; C.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W/2; CY = H/2;
    BOARD_R = Math.min(W, H) * 0.38;
    MR = Math.max(6, BOARD_R * 0.065);
    buildSlots();
    boardAlpha = phase > 0 ? 1 : 0;
    grooveRevealProgress = phase > 1 ? 1 : 0;
  }

  // ---- MAIN LOOP ----
  function tick(t) {
    var dt = Math.min(32, t - lastT);
    lastT = t;

    // Update physics
    var allM = marbles.concat(overflowMarbles);
    for (var i = 0; i < allM.length; i++) updateMarble(allM[i], dt/16);

    updatePhase(dt);
    render();
    updateHUD();
    requestAnimationFrame(tick);
  }

  // ---- GAME STATE FOR PLAYWRIGHT ----
  window.render_game_to_text = function() {
    return JSON.stringify({
      phase: PHASES[phase].name,
      phaseIndex: phase,
      coverage: coveragePct,
      marbles: marbles.length,
      overflow: overflowMarbles.length,
      slots: slots.length,
      filled: slots.filter(function(s){return s.filled;}).length
    });
  };

  window.advanceTime = function(ms) {
    var steps = Math.max(1, Math.round(ms / 16));
    for (var i = 0; i < steps; i++) {
      var allM = marbles.concat(overflowMarbles);
      for (var j = 0; j < allM.length; j++) updateMarble(allM[j], 1);
      updatePhase(16);
    }
    render();
    updateHUD();
  };

  // ---- BOOT ----
  window.addEventListener('resize', resize);
  resize();
  buildHUD();
  requestAnimationFrame(tick);

  // Fullscreen toggle
  document.addEventListener('keydown', function(e) {
    if (e.key === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });
})();
</script>
</body>
</html>
