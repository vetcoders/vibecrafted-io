<title>Vibecrafted</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0a0a0b; --panel:#121214; --line:#27272a; --text:#f4f4f5;
  --dim:#71717a; --mute:#a1a1aa; --copper:#e4e4e7; --green:#4ade80;
  --red:#f87171; --cyan:#a1a1aa; --gold:#fbbf24; --sel:#27272a; --live:#4ade80;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ground);color:var(--text);overflow:hidden;
  font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.45}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 26px;height:100%}
.rail{grid-row:1;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rail-head{padding:10px 12px 6px;font-size:10.5px;font-weight:500;letter-spacing:.12em;color:var(--dim)}
.rail-body{flex:1;overflow-y:auto;padding:0 0 8px}
.group{margin:6px 0 2px;padding:0 12px;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.group .n{color:var(--mute);letter-spacing:0;margin-left:6px}
.sess{padding:7px 12px 6px;cursor:pointer;border-left:2px solid transparent}
.sess:hover{background:#1a1a1e}
.sess.on{background:#1a1a1e;border-left-color:var(--live)}
.sess .row{display:flex;align-items:baseline;gap:8px}
.sess .mark{width:10px;flex:none;color:var(--dim)}
.sess.live .mark{color:var(--green)}
.sess.stale .mark{color:var(--gold)}
.sess .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .meta{color:var(--dim);font-size:11px}
.sess .face{padding:1px 0 0 20px;color:var(--dim);font-size:11px}
.rail-foot{padding:8px 12px 10px;border-top:1px solid var(--line)}
.new{width:100%;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:6px;
  font:inherit;font-size:12px;padding:6px 8px;cursor:pointer;text-align:left}
.new:hover{border-color:#3f3f46;color:var(--text)}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ground)}
.tabs{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);background:var(--panel);
  overflow-x:auto;flex:none;min-height:32px}
.tab{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);
  font:inherit;font-size:12px;padding:0 12px;height:32px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:#1a1a1e}
.tab.live{border-bottom-color:var(--green)}
.tab.stale{border-bottom-color:var(--gold)}
.tab.idle{border-bottom-color:#3f3f46}
.tab.on.live{color:var(--green)}
.tab.on.stale{color:var(--gold)}
#term{flex:1 1 0;min-height:0;overflow-y:auto;padding:12px 16px 8px;white-space:pre-wrap;word-break:break-word;overscroll-behavior:contain}
#term .c{color:var(--copper)} #term .g{color:var(--green)} #term .r{color:var(--red)}
#term .d{color:var(--dim)} #term .y{color:var(--gold)} #term .b{color:var(--mute)}
#term .bold{font-weight:600}
.inline{display:flex;gap:8px;padding:7px 14px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.inline .ps1{color:var(--green);font-weight:600}
#cmd{flex:1;background:none;border:none;outline:none;color:var(--text);font:inherit;caret-color:var(--green)}
.statusbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 12px;
  border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--dim)}
.statusbar .lock{color:var(--gold)}
.statusbar .right{margin-left:auto}
.blink{animation:bl 1.2s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
::selection{background:var(--sel)}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{display:none}}
@media(prefers-reduced-motion:reduce){.blink{animation:none}}
html.embed,html.embed body{height:100%;background:var(--ground)}
</style>

<div class="app">
  <aside class="rail">
    <div class="rail-head">SESSIONS</div>
    <div class="rail-body" id="rail"></div>
    <div class="rail-foot"><button class="new" id="new-sess" type="button">+ New session</button></div>
  </aside>
  <div class="workspace">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open panes"></div>
    <div id="term"></div>
    <div class="inline"><span class="ps1">❯</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="command"></div>
  </div>
  <div class="statusbar">
    <span class="lock">LOCK</span><span>PANE</span><span>TAB</span><span>MOVE</span>
    <span class="right"><span id="stat-name">loctree</span> · <span id="clock">20:57</span> · <span id="stat-state">live</span></span>
  </div>
</div>

<script>
"use strict";
const EMBED=new URLSearchParams(location.search).has("embed");
if(EMBED) document.documentElement.classList.add("embed");
const $=s=>document.querySelector(s);
const term=$("#term"), input=$("#cmd");
const AGENTS=["claude","codex","agy","junie","grok"];
const SKILLS={scaffold:["READ","0.2.0"],implement:["WRITE","2.2.0"],review:["READ","2.0.0"],workflow:["WRITE","3.6.0"],
followup:["READ","2.2.0"],marbles:["WRITE","7.0.0"],audit:["READ","1.0.0"],polarize:["WRITE","2.0.0"],
dou:["READ","2.1.0"],decorate:["WRITE","2.1.0"],hydrate:["WRITE","1.0.0"],release:["WRITE","0.2.1"],
justdo:["WRITE","3.1.0"],intents:["READ","1.0.1"],research:["READ","1.3.0"],prune:["READ","3.3.3"],
trust:["READ","1.0.0"],guard:["READ","1.0.0"],partner:["READ","—"],ownership:["WRITE","—"],delegate:["READ","—"]};
const FLOWS={workflow:"examine → research → implement → verify",marbles:"map cracks → L1 fix → L2…LN → settle",
prune:"map runtime cone → separate live truth → cut proven dead → verify",implement:"init → implement cut → verify real path → followup",
dou:"crawl buyer surface → test install/trust → collect gaps → undone verdict",release:"prove readiness → build+sign → publish → rollback truth"};
const MODES=["implement","research","review","plan","prompt","observe","await","stop","resume"];
const DECK=["help","version","status","doctor","receipt","init","resume","update","uninstall","dashboard","loop","cron",
"dispatch","server","gui","tui","telemetry","ship","clear","surfaces","loct","loctree","aicx","slack","vc-slack","/vc",...Object.keys(SKILLS),...AGENTS];
let runs=[], hist=[], hi=0, activeId=0, nextId=8;

function clockNow(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return p(d.getHours())+":"+p(d.getMinutes());
}

const sessions=[
  {id:0, name:"loctree", agent:"grok", group:"live", time:"20:57", faces:["sight"], buf:""},
  {id:2, name:"aicx", agent:"codex", group:"live", time:"20:51", faces:["memory"], buf:""},
  {id:3, name:"vc-slack", agent:"grok", group:"idle", time:"19:12", faces:["mouth"], buf:""},
  {id:4, name:"vibecrafted", agent:"claude", group:"live", time:"18:40", faces:["hands"], buf:""},
  {id:5, name:"codescribe", agent:"grok", group:"stale", time:"18:11", faces:["voice"], buf:""},
  {id:6, name:"channel", agent:"grok", group:"idle", time:"16:44", faces:["prove"], buf:""}
];

const SETTLEMENT=`<span class="c bold">⚒  𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍.</span>  <span class="d">4.1.0+g237d2814 · operator loop · grok</span>
<span class="d">────────────────────────────────────────────────────────</span>
<span class="c bold">AI can write. Evidence decides.</span>
<span class="d">Sight · Memory · Hands · Sprawczość</span>

<span class="g">map</span>       <span class="b">loct impact src/auth.ts</span>
<span class="d">          blast radius before the edit</span>
<span class="g">remember</span>  <span class="b">aicx search "handoff"</span>
<span class="d">          typed memory, not chat residue</span>
<span class="g">craft</span>     <span class="b">vc justdo grok -p "ship the release"</span>
<span class="d">          gates. green CI is not a verdict</span>
<span class="g">wire</span>      <span class="b">/vc grok send "finish until daily-driver"</span>
<span class="d">          Slack = projector. tokens stay on the host</span>

<span class="g">f</span>  four cuts of the same truth · 0 gates red
<span class="d">try</span> <span class="b">help</span> · <span class="b">surfaces</span> · <span class="b">loct</span> · <span class="b">aicx</span> · <span class="b">/vc grok send "…"</span>`;

const STALE=`<span class="c bold">⚒  vibecrafted</span>  <span class="d">stale pane · last write 20:51</span>
<span class="d">────────────────────────────────────────────────────────</span>
<span class="d">[work-260821-183344-22011]</span> <span class="y">stale</span> — worker went quiet after followup.
<span class="d">resume only as a NEW tracked job:</span>
<span class="b">vibecrafted grok resume --run-id work-260821-183344-22011</span>`;

const IDLE_PANE=`<span class="d">operator pane — four cuts of the same truth.</span>
<span class="d">sight</span>   <span class="b">loct impact src/auth.ts</span>
<span class="d">memory</span>  <span class="b">aicx search "handoff"</span>
<span class="d">mouth</span>   <span class="b">/vc grok send "finish until daily-driver"</span>
<span class="d">hands</span>   <span class="b">justdo grok -p "ship with a receipt"</span>
<span class="d">try</span> <span class="b">help</span> · <span class="b">surfaces</span>`;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function put(html){const d=document.createElement("div");d.innerHTML=html;term.appendChild(d);term.scrollTop=term.scrollHeight}
function line(t,cls){put(cls?`<span class="${cls}">${esc(t)}</span>`:esc(t))}
function raw(h){put(h)}
function prompt_(cmdtext){put(`<span class="c bold">❯</span> ${esc(cmdtext)}`)}
function current(){return sessions.find(s=>s.id===activeId)}
function saveBuf(){const s=current(); if(s) s.buf=term.innerHTML}

function paintTabs(){
  const el=$("#tabs"); el.innerHTML="";
  sessions.forEach(s=>{
    const b=document.createElement("button");
    b.type="button"; b.className=`tab ${s.group}${s.id===activeId?" on":""}`;
    b.textContent=`#${s.id}`;
    b.setAttribute("aria-selected", s.id===activeId?"true":"false");
    b.onclick=()=>selectSession(s.id);
    el.appendChild(b);
  });
}

function rail(){
  const el=$("#rail"); el.innerHTML="";
  const liveRuns=runs.filter(r=>r.state==="active"||r.state==="launching");
  const groups=["live","stale","idle"];
  groups.forEach(g=>{
    const items=sessions.filter(s=>s.group===g);
    if(!items.length) return;
    const label=g==="live"?"LIVE":g==="stale"?"STALE":"IDLE";
    el.insertAdjacentHTML("beforeend", `<div class="group">${label}<span class="n">${items.length}</span></div>`);
    items.forEach(s=>{
      const on=s.id===activeId?" on":"";
      const mark=s.group==="live"?"●":s.group==="stale"?"◐":"○";
      const faces=s.faces.map(f=>`<div class="face">· ${esc(f)}</div>`).join("");
      el.insertAdjacentHTML("beforeend",
        `<div class="sess ${s.group}${on}" data-id="${s.id}"><div class="row"><span class="mark">${mark}</span><span class="name">${esc(s.name)}</span><span class="meta">${esc(s.time)}</span></div>${faces}</div>`);
    });
  });
  liveRuns.forEach(r=>{
    el.insertAdjacentHTML("beforeend", `<div class="sess live"><div class="row"><span class="mark">·</span><span class="name">${esc(r.agent)}</span><span class="meta">${esc(r.skill)}</span></div></div>`);
  });
  el.querySelectorAll(".sess[data-id]").forEach(n=>{
    n.addEventListener("click",()=>selectSession(Number(n.dataset.id)));
  });
  paintTabs();
  const s=current();
  if(s){
    $("#stat-name").textContent=s.name;
    $("#stat-state").textContent=s.group;
    $("#clock").textContent=s.time;
  }
}

function selectSession(id){
  if(id===activeId) return;
  saveBuf();
  const s=sessions.find(x=>x.id===id); if(!s) return;
  activeId=id;
  term.innerHTML=s.buf||IDLE_PANE;
  term.scrollTop=term.scrollHeight;
  rail();
}

function nowId(){const d=new Date();const p=n=>String(n).padStart(2,"0");
  return `work-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${10000+Math.floor(Math.random()*89999)}`}

const CHATTER={
  workflow:["loct impact — blast radius before the edit","aicx search — intent survived compaction","cut landed under gates, not vibes","/vc send queued · Slack is projector"],
  marbles:["L1: mapa pęknięć — 3 kandydaci","L1 fix + verify: 2/3 zamknięte","L2: kontrprzykład ubity, re-run gates","powierzchnia trzyma — settle"],
  prune:["runtime cone zdefiniowany","KEEP-RUNTIME 61 · DELETE-NOW 14 · FORGOTTEN-GEM 3","gates po fali: zielone","gems report zapisany"],
  generic:["vc-init: perception → intentions → ground truth","praca w toku…","artefakty zapisane do reports/","gates: zielone"]};

function startRun(skill,agent,promptTxt){
  const id=nowId();
  const run={id,agent,skill,state:"launching",t0:Date.now(),lines:[],report:`reports/${skill}/${id}_report.md`};
  runs.push(run);
  const s=current();
  if(s){s.group="live";s.agent=agent;s.time=clockNow()}
  rail();
  raw(`<span class="d">==================== VIBECRAFTED LAUNCH RECEIPT ====================</span>`);
  line(`run_id:     ${id}`);line(`agent:      ${agent}`);line(`skill:      ${skill}`);
  line(`root:       /Volumes/vc-workspace/vetcoders/vibecrafted-suite/vibecrafted`);
  line(`status:     launching`);line(`report:     ~/.vibecrafted/artifacts/…/${run.report}`);
  raw(`observe:    <span class="b">vibecrafted ${agent} observe --run-id ${id}</span>`);
  raw(`await (ARM NOW, supervisor-side): <span class="b">vibecrafted ${agent} await --run-id ${id}</span>`);
  raw(`<span class="d">=====================================================================</span>`);
  const chat=CHATTER[skill]||CHATTER.generic;
  let step=0;
  run.timer=setInterval(()=>{
    if(step===0){run.state="active";run.lines.push("worker alive, transcript rośnie");}
    else if(step<=chat.length){run.lines.push(chat[step-1]);}
    else{run.state="report_validated";run.settle=Math.random()<0.85?"f":"x";clearInterval(run.timer);
      raw(`<span class="d">[${run.id}]</span> <span class="g">report_validated</span> — settlement <span class="${run.settle==="f"?"g":"y"}">${run.settle}</span> · raport: ${run.report}`);
      if(s) s.group="live";}
    rail();step++;
  },2200);
  if(promptTxt)run.lines.push(`prompt: ${promptTxt}`);
}

const SURFACES=`<span class="c bold">four cuts of the same truth</span>
<span class="d">Sight · Memory · Hands · Sprawczość</span>
  <span class="b">loctree</span>      sight    <span class="d">loct impact src/auth.ts</span>
  <span class="b">aicx</span>         memory   <span class="d">aicx search "handoff"</span>
  <span class="b">vc-slack</span>     mouth    <span class="d">/vc grok send "…"</span>
  <span class="b">vibecrafted</span>  hands    <span class="d">justdo grok -p "ship"</span>
<span class="d">Slack is a projector. The bus is the log. Green CI is not a verdict.</span>`;

const HELP=`<span class="c bold">⚒  𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍. 4.1.0+g237d2814</span> — AI can write. Evidence decides.
<span class="d">Sight · Memory · Hands · Sprawczość</span>
<span class="d">─────────────────────────────────────────</span>
Four cuts:
  <span class="b">loct</span>     structural vision. AST, importers, blast radius.
  <span class="b">aicx</span>     durable intent from raw agent sessions.
  <span class="b">/vc</span>      mouth on the bus. Slack is a projector.
  <span class="b">justdo</span>   hands under gates. Green CI is not a verdict.

Usage:
  <span class="b">loct impact src/auth.ts</span>
  <span class="b">aicx search "handoff"</span>
  <span class="b">/vc grok send "finish until daily-driver"</span>
  vibecrafted &lt;skill&gt; &lt;agent&gt; [-p &lt;prompt&gt; | -f &lt;file&gt;]

Commands:
  <span class="b">surfaces</span>            Four cuts · real commands
  <span class="b">init [agent]</span>         Orient an agent in this repo
  <span class="b">&lt;skill&gt; &lt;agent&gt;</span>      Run a workflow with an agent
  <span class="b">resume &lt;agent&gt;</span>       Continue a stopped run or provider session
  <span class="b">status</span> · <span class="b">doctor</span> · <span class="b">receipt</span> · <span class="b">update</span> · <span class="b">uninstall</span>
  <span class="b">dashboard</span> · <span class="b">loop</span> · <span class="b">cron</span> · <span class="b">dispatch</span> · <span class="b">server</span> · <span class="b">gui</span> · <span class="b">tui</span>

Ship cycle:
  <span class="c">map → remember → craft → wire → prove</span>
  <span class="d">scaffold → implement → review → workflow → followup → marbles → audit → polarize → dou → hydrate → release</span>

Agents:  ${AGENTS.join(" · ")}
Try: <span class="b">loct impact src/auth.ts</span> · <span class="b">aicx search "handoff"</span> · <span class="b">/vc grok send "ship it"</span>`;

function helpTopic(t){
  if(t==="loctree") t="loct";
  if(t==="vc-slack"||t==="/vc") t="slack";
  if(SKILLS[t]){const[rw,v]=SKILLS[t];
    raw(`<span class="c bold">⚒  ${t}</span>\n<span class="d">─────────────────────────────</span>\n  version ${v} · <span class="${rw==="READ"?"g":"c"}">${rw}</span>\nUsage:\n  vibecrafted ${t} &lt;${AGENTS.join("|")}&gt; [flags]\n  vc-${t} &lt;agent&gt; [flags]${FLOWS[t]?`\nFlow:\n  ${FLOWS[t]}`:""}\nFlags: -p/--prompt · -f/--file · --prompt-stdin · --runtime · --root · --model · --json${t==="marbles"?" · --count · --depth\nControls: pause stop resume session inspect delete gc":""}`);return}
  const T={loct:`Usage:\n  loct impact &lt;path&gt;   blast radius before the edit\n  loct slice &lt;path&gt;    cut surface, importers live\n  loct dead            dead symbols listed, not guessed\nSight is not a vibe. Structure before generation.`,
  aicx:`Usage:\n  aicx search "handoff"\nDurable intent from raw agent sessions. Typed memory, not chat residue.\nAdapters: Claude · Codex · Gemini · Junie · Grok.`,
  slack:`Usage:\n  /vc &lt;agent&gt; send "…"\n  vc-slack mcp\nMouth, not scrape. OAuth + MCP + Socket Mode.\nTokens stay on the host. Slack = projector. fleet-bus = log.`,
  surfaces:SURFACES,
  resume:`Usage:\n  vibecrafted resume &lt;agent&gt; --run-id work-… | --session &lt;uuid&gt; | (AICX 48h pack)\nNigdy work-* do --session. --fork-session tylko claude.`,
  uninstall:`Usage:\n  vibecrafted uninstall [--dry-run]\nInwentarz → restore kit → cięcie. Od 82dbce90 dry-run znaczy suchy. Serio.`,
  server:`Usage:\n  vibecrafted server [start|stop|status|open|doctor] [--port 3024]\n  vibecrafted server service [install|start|stop|status|uninstall]`,
  dispatch:`Usage:\n  vibecrafted dispatch &lt;plan.dispatch.toml&gt; [--doctor|--dry-run|--json|--resume]\n  vibecrafted dispatch run --run-id … -- &lt;cmd&gt;`,
  loop:`Usage:\n  vibecrafted loop start --prompt "…" [--completion-promise READY]\n  vibecrafted loop next | status | complete | await-run --run-id … --then-cmd '…'`};
  if(T[t]){raw(`<span class="c bold">⚒  ${t}</span>\n${T[t]}`);return}
  line(`Brak topicu "${t}" w symulatorze.`,"d")
}

function cmdStatus(){
  if(!runs.length){line("Cisza. Zero runów w tej sesji.","d");return}
  runs.forEach(r=>{const st=r.state==="report_validated"?`<span class="g">${r.state}</span>`:r.state==="active"?`<span class="c">active</span>`:`<span class="d">${r.state}</span>`;
    raw(`  ${r.id}  ${r.agent.padEnd(6)}  ${r.skill.padEnd(10)}  ${st}${r.settle?`  <span class="${r.settle==="f"?"g":"y"}">${r.settle}</span>`:""}`)})
}
function findRun(args){
  if(args.includes("--last"))return runs[runs.length-1];
  const i=args.indexOf("--run-id");if(i>=0)return runs.find(r=>r.id===args[i+1]);
  return runs[runs.length-1];
}

function exec(text){
  const t=text.trim();if(!t)return;prompt_(t);
  hist.push(t);hi=hist.length;
  if(t.startsWith("/vc")){
    const m=t.match(/^\/vc\s+(\S+)\s+send\s+([\s\S]+)$/i);
    if(!m){raw(`<span class="y">usage:</span> /vc &lt;agent&gt; send "…"  ·  agents: ${AGENTS.join(" · ")}`);return}
    const ag=m[1].toLowerCase(); const msg=m[2].replace(/^["']|["']$/g,"");
    if(!AGENTS.includes(ag)){raw(`<span class="y">unknown agent</span> \`${esc(ag)}\` — try /vc agents`);return}
    raw(`<span class="c bold">*agent:${esc(ag)}*</span> <span class="d">· peer-bus · from operator</span>\n${esc(msg)}\n<span class="d">_via \`/vc ${esc(ag)} send\`_</span>\n<span class="g">ok</span> <span class="d">· dry_run sandbox · envelope queued · Slack is the projector, not the log</span>`);
    return;
  }
  let rest=t.replace(/^vibecrafted(?:\s+|$)/,"").replace(/^vc-/,"").trim();
  if(!rest) rest="help";
  const a=rest.split(/\s+/);let c=a[0];
  if(MODES.includes(c)&&AGENTS.includes(a[1])){const ag=a[1];a[1]=c;a[0]=ag;c=ag;}
  const pIdx=a.findIndex(x=>x==="-p"||x==="--prompt");
  const ptxt=pIdx>=0?t.split(/\s(?:-p|--prompt)\s/)[1]?.replace(/^"|"$/g,""):null;

  if(c==="clear"){term.innerHTML="";return}
  if(c==="help"||c==="--help"||c==="-h"){a[1]&&a[1]!=="--all"?helpTopic(a[1]):raw(HELP);return}
  if(c==="surfaces"||c==="surface"){raw(SURFACES);return}
  if(c==="loct"||c==="loctree"){
    const sub=a[1]||"impact";
    raw(`<span class="c bold">loct ${esc(sub)}</span> <span class="d">· sight before the edit</span>\n<span class="d">atlas 00–05 · importers live · blast radius on ${esc(a[2]||"src/")}</span>\n<span class="g">slice()</span> on the cut · <span class="g">impact()</span> before delete · <span class="d">dead symbols listed, not guessed</span>`);
    return;
  }
  if(c==="aicx"){
    const q=t.replace(/^aicx(?:\s+search)?\s*/i,"").replace(/^["']|["']$/g,"")||"handoff";
    raw(`<span class="c bold">aicx search</span> <span class="d">· durable intent, not chat residue</span>\n  <span class="b">${esc(q)}</span>\n<span class="d">adapters: Claude · Codex · Gemini · Junie · Grok</span>\n<span class="g">1 hit</span> <span class="d">· typed memory survived compaction · session pack 48h</span>`);
    return;
  }
  if(c==="slack"||c==="vc-slack"){
    raw(`<span class="c bold">vc-slack</span> <span class="d">· mouth, not scrape</span>\n  oauth install · mcp · /vc &lt;agent&gt; send\n<span class="d">tokens stay on the host. Slack = projector. fleet-bus = log.</span>\ntry <span class="b">/vc grok send "finish until daily-driver"</span>`);
    return;
  }
  if(c==="version"){line("vibecrafted 4.1.0+g237d2814 (simulator)");return}
  if(c==="status"||c==="stats"){cmdStatus();return}
  if(c==="doctor"||c==="check"){raw(`<span class="g">✓</span> sight loctree · <span class="g">✓</span> memory aicx · <span class="g">✓</span> mouth vc-slack · <span class="g">✓</span> hands vibecrafted\n<span class="g">✓</span> deck alive · tools/vibecrafted-current → 4.1.0+ga7f262d9\n<span class="d">green CI is not a product verdict. Slack is a projector.</span>\nsummary: simulation — live machine: <span class="b">vc-doctor</span>`);return}
  if(c==="receipt"){raw(`vetcoders/vibecrafted → fix/framework-fail-points-0819 @ <span class="c">16c44f8c</span> · dirty=no · installed=g237d2814 <span class="y">SOURCE_AHEAD_OF_INSTALLED</span>`);return}
  if(c==="settlements"||c==="resume-session"){raw(`<span class="c">⚒</span>  "${c}" is not in the command deck.`);return}
  if(c==="uninstall"||c==="remove"){
    if(a.includes("--dry-run")){raw(`<span class="bold">𝚅𝚒𝚋𝚎𝚌𝚛𝚊𝚏𝚝𝚎𝚍. Uninstall</span>\n\nManaged teardown inventory:\n  remove   shared-skill: …/skills/vc-agents  <span class="d">(+31 dalszych)</span>\n  remove   runtime-data: releases · providers · server · active.json\n  preserve operator-data: artifacts · control_plane · logs\n  preserve uv-tool: vibecrafted · vibecrafted-mcp · vibecrafted-iterm2\n\n<span class="g">Dry run — nic nie usunięto, zero backupu.</span>`);return}
    raw(`<span class="r">✗</span> Simulator refuses a wet uninstall.`);return}
  if(c==="dashboard"||c==="start"){a[1]==="ls"?raw(sessions.map(s=>`  #${s.id} ${s.name}  <span class="d">${s.group}</span>`).join("\n")):line(`[sim] layout: ${a[1]||"dashboard"} — in real life vc-frame takes the screen`,"d");return}
  if(c==="init"&&(!a[1]||AGENTS.includes(a[1]))){raw(`<span class="c">⚒</span> init ${a[1]||"claude"}: perception (loct context — czytaj DO KOŃCA) → intentions (aicx intents) → ground truth (repo-full)\n<span class="d">Orientacja, nie pipeline. Ślepy start = process failure.</span>`);return}
  if(AGENTS.includes(c)){const m=a[1];
    if(!m||!MODES.includes(m)){raw(`Modes for ${c}: ${MODES.join(" · ")}`);return}
    if(m==="observe"){const r=findRun(a);r?raw(`<span class="d">[${r.id}] tail:</span>\n`+r.lines.slice(-4).map(l=>"  "+esc(l)).join("\n")):line("Brak runów.","d");return}
    if(m==="await"){const r=findRun(a);if(!r){line("Brak runów.","d");return}
      line(`await uzbrojony na ${r.id} — supervisor-side, bez pollingu…`,"d");
      const iv=setInterval(()=>{if(r.state==="report_validated"){clearInterval(iv);raw(`<span class="g">await:</span> ${r.id} → report_validated · settlement <span class="${r.settle==="f"?"g":"y"}">${r.settle}</span>`)}},600);return}
    if(m==="stop"){const r=findRun(a);if(r&&r.timer){clearInterval(r.timer);r.state="stopped";rail();raw(`<span class="y">TERM</span> → ${r.id} stopped. Restart tylko jako NOWY tracked job: <span class="b">${c} resume --run-id ${r.id}</span>`)}else line("Nie ma czego stopować.","d");return}
    if(m==="resume"){const r=findRun(a);if(r){startRun(r.skill,c,"(resume z batonem)")}else line("Brak runa do wznowienia.","d");return}
    startRun(m==="prompt"?"justdo":m,c,a.slice(2).join(" "));return}
  if(SKILLS[c]){const ag=AGENTS.includes(a[1])?a[1]:null;
    if(!ag){raw(`Usage: vibecrafted ${c} &lt;${AGENTS.join("|")}&gt; [-p "…"]`);return}
    if(c==="marbles"&&["pause","stop","resume","gc","inspect","session","delete"].includes(a[1])){line(`[marbles ${a[1]}] kontrola orkiestratora — symulacja przyjęła`,"d");return}
    startRun(c,ag,ptxt);return}
  if(c==="server"){raw(`server ${a[1]||"status"}: <span class="g">●</span> io.vetcoders.vibecrafted.server enabled · port 3024 <span class="d">(symulacja)</span>`);return}
  if(c==="gui"||c==="tui"){line(`[sim] ${c==="gui"?"control plane na 127.0.0.1":"voc — rustowy kokpit"}`,"d");return}
  if(c==="loop"||c==="cron"||c==="dispatch"||c==="ship"||c==="telemetry"){helpTopic(c==="ship"?"loop":c);return}
  raw(`<span class="c">⚒</span>  "${esc(c)}" is not in the command deck.\n  Try <span class="b">help</span> for the current surface.`)
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){exec(input.value);input.value="";}
  else if(e.key==="ArrowUp"){if(hi>0){hi--;input.value=hist[hi]||"";e.preventDefault()}}
  else if(e.key==="ArrowDown"){if(hi<hist.length){hi++;input.value=hist[hi]||"";e.preventDefault()}}
  else if(e.key==="Tab"){e.preventDefault();
    const parts=input.value.split(/\s+/);const last=parts[parts.length-1];
    const pool=parts.length<=1?DECK:(SKILLS[parts[0]]||["init","resume"].includes(parts[0])?AGENTS:AGENTS.includes(parts[0])?MODES:DECK);
    const hit=pool.filter(x=>x.startsWith(last));
    if(hit.length===1){parts[parts.length-1]=hit[0];input.value=parts.join(" ")+" "}
    else if(hit.length>1)line(hit.join("  "),"d");}
});
document.addEventListener("click",e=>{
  if(e.target.closest(".rail")||e.target.closest(".tabs")||e.target.closest(".new")) return;
  if(!window.getSelection().toString()) input.focus();
});
$("#new-sess").addEventListener("click",()=>{
  saveBuf();
  const id=nextId++;
  sessions.push({id,name:"session-"+id,agent:"grok",group:"idle",time:clockNow(),faces:["grok"],buf:IDLE_PANE});
  selectSession(id);
});

sessions[0].buf=SETTLEMENT;
sessions.forEach((s,i)=>{ if(i===0) return; s.buf=s.group==="stale"?STALE:IDLE_PANE });
term.innerHTML=SETTLEMENT;
rail();
if(!EMBED) input.focus();
</script>
